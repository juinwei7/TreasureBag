    # 副本Ⅰ 源林森林
    - st綠紋翡翠
    - st獵翳石骨
    - st紋麟角
    - st嗜血珠
    - st萬年木材
    - st魔帝鳴骨
    # 副本Ⅱ 冰晶雪原
    - 冰st靈獸永恆寒冰
    - 冰st雪神冰霜利爪
    - 冰st冰霜鍛鐵
    - 冰st寒冰骨骼
    - 冰st凍原冰晶
    - 冰st貝西晶體
    - 冰st萬年寒冰
    - 冰st凜冬之心
    # 副本Ⅲ 天之國度
    - 天st彩光羽翼
    - 天st天地符文
    - 天st謎姬之絲
    - 天st赤米汀球
    - 天st爾希米聖水
    - 天st光凌天寒石
    - 天st聖輝天石
    - 天st淨光聖羽
    # 副本Ⅳ 月赫星球
    - 月st疾邯蝕磜
    - 月st玥鷙川杖
    - 月st駭爾石
    - 月st憂曜靡奧
