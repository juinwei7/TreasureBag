#########################################
#            玩家權限表                   #
#     treasure-bag.<permission>         #
#########################################

MAX_SLOT:
  DEFAULT: 45
  VIP: 90
  VIP2: 135
  VIP3: 180
  VIP4: 225

#########################################
#            礦物倉庫                     #
#   背包裡的分頁（/bag ore），各分流共用     #
#########################################

ORE:
  # 每人可存的總件數（所有物品加起來），照背包同一組權限 treasure-bag.<階級>，有好幾個取最大；
  # /bag oreadmin space 個別設定優先。存量超過容量的只能取出，取到容量以下才能再存
  SPACE:
    DEFAULT: 2000
    VIP: 4000
    VIP2: 8000
    VIP3: 16000
    VIP4: 32000
  # 清單最多幾種物品
  MAX_KINDS: 135
  # true：挖方塊掉的東西身上放不下才收進倉庫；false：清單裡有開自動收集的全部收
  ONLY_WHEN_FULL: true
  # 不能存的物品
  BLACKLIST:
    - BEDROCK
  # 新玩家一開始的清單（自動收集開著）
  DEFAULT_LIST:
    - COAL_BLOCK
    - LAPIS_BLOCK
    - REDSTONE_BLOCK
    - IRON_BLOCK
    - GOLD_BLOCK
    - DIAMOND_BLOCK
    - EMERALD_BLOCK
    - COAL
    - REDSTONE
    - IRON_ORE
    - GOLD_ORE
    - DIAMOND
    - EMERALD
    - LAPIS_LAZULI
    - RAW_IRON
    - RAW_COPPER
    - RAW_GOLD
    - RAW_IRON_BLOCK
    - RAW_COPPER_BLOCK
    - RAW_GOLD_BLOCK

#########################################
#            副本素材倉庫                  #
#  背包裡的分頁（/bag material），各分流共用  #
#########################################

MATERIAL:
  # 每人可存的總件數（跟礦物倉庫分開算），照背包同一組權限 treasure-bag.<階級>，有好幾個取最大；
  # 0 表示不能用（一般玩家），VIP 到期的人還能把存著的取出來。/bag materialadmin space 個別設定優先
  SPACE:
    DEFAULT: 0
    VIP: 400
    VIP2: 800
    VIP3: 1600
    VIP4: 3200
  # false：撿到就收（身上有空也收）；true：身上放不下的才收
  ONLY_WHEN_FULL: false
  # 收哪些 MythicMobs 物品（代號），畫面照這個順序排；拿掉的代號玩家存著的照樣能取
