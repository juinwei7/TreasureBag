  TIME_S: 秒
  TIME_M: 分鐘
  TIME_H: 小時
  TIME_D: 天
  TIME_Y: 年
  IS_NULL: '§c無'

# 一般子指令
COMMAND:
  OPEN: 開啟隨身背包
  RELOAD: 重新載入設定
  FORCE: （管理員）強制開啟自己的背包，超出格物品掉在腳下
  NAME: 幫背包頁面取名字
  LOG: 查看玩家的背包存取紀錄
  ORE: 打開礦物倉庫
  ORE_ADMIN: 管理玩家的礦物倉庫
  MATERIAL: 打開副本素材倉庫
  MATERIAL_ADMIN: 管理玩家的副本素材倉庫

